services:
  - type: web
    name: proxy-anisha
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: CEREBRAS_API_KEY
        sync: false
      - key: CEREBRAS_MODEL
        value: llama-3.3-70b
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SAMBANOVA_API_KEY
        sync: false
      - key: SAMBANOVA_MODEL
        value: Meta-Llama-3.3-70B-Instruct
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: meta-llama/llama-3.3-70b-instruct:free
      - key: JUDGE_MODEL
        value: google/gemini-2.0-flash-exp:free
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: CALCOM_API_KEY
        sync: false
      - key: CALCOM_EVENT_TYPE_ID
        sync: false
      - key: CALCOM_USERNAME
        sync: false
      - key: CALCOM_EVENT_SLUG
        sync: false
      - key: CALCOM_TIMEZONE
        value: Asia/Kolkata
      - key: GITHUB_USERNAME
        value: anishadua
      - key: GITHUB_TOKEN
        sync: false
      - key: CONFIDENCE_THRESHOLD
        value: "0.45"
      - key: RETRIEVAL_TOP_K
        value: "6"
      - key: OWNER_NAME
        value: Anisha Dua
      - key: OWNER_EMAIL
        value: anishadua2005@gmail.com
